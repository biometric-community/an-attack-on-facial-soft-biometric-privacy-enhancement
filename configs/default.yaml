paper:
  slug: an-attack-on-facial-soft-biometric-privacy-enhancement
  title: "An Attack on Facial Soft-Biometric Privacy Enhancement"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  pretrained: true
privacy:
  block_size: 16
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 64
  epochs: 8
  lr: 0.05
eval:
  batch_size: 128
  max_lfw_pairs: null
attack:
  max_gallery: 2000
  max_probe: 1000
  max_gallery_recon: 400
  reconstruct_match: true
  n_list: [1, 5, 10, 50]
  modes: [majority, average, linear, log]
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
